name: CI

on:
    pull_request:
    push:
      branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Format and lint
        run: bunx biome ci .
        
      - name: Typecheck
        run: bun run typecheck

      - name: Help works
        run: node bin/kivo.mjs --help | grep -q "terminal coding agent"

      - name: Package contains the launcher
        run: npm pack --dry-run 2>&1 | grep -q "bin/kivo.mjs"

